<header class="site-header">
  <div class="wrap header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Max Rudolph, home">
      <span class="wordmark-mark" aria-hidden="true">MR</span>
      <span class="wordmark-name">Max Rudolph</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <span class="nav-toggle-label">Menu</span>
      <span class="nav-toggle-bars" aria-hidden="true"></span>
    </button>
    <nav id="site-nav" class="site-nav">
      {% for item in site.data.navigation %}
        <a
          href="{{ item.url | relative_url }}"
          {% if item.external %}target="_blank" rel="noopener"{% endif %}
          {% if page.url == item.url %}aria-current="page"{% endif %}
        >{{ item.title }}</a>
      {% endfor %}
      <button class="theme-toggle" type="button" aria-label="Toggle color theme">
        <span class="theme-toggle-to-dark" aria-hidden="true">Dark</span>
        <span class="theme-toggle-to-light" aria-hidden="true">Light</span>
      </button>
    </nav>
  </div>
</header>
